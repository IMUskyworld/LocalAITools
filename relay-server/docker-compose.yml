services:
  relay:
    build:
      context: ..
      dockerfile: relay-server/Dockerfile
    image: localmind-relay:local
    restart: unless-stopped
    environment:
      RELAY_BIND: 0.0.0.0:8080
      RELAY_DB_PATH: /var/lib/localmind-relay/relay.db
      RUST_LOG: info,localmind_relay=info
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - relay-data:/var/lib/localmind-relay
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  relay-data:
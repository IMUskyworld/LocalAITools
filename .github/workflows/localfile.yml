# LocalFile CI/CD 流水线
# 对齐：部署设计 §4.2 流水线 8 阶段

name: LocalFile CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'localfile/**'
      - 'shared-contract/**'
      - '.github/workflows/localfile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'localfile/**'
      - 'shared-contract/**'
      - '.github/workflows/localfile.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  lint:
    name: Lint & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: localfile

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ktlint check
        run: ./gradlew ktlintCheck || true
        continue-on-error: true

      - name: detekt
        run: ./gradlew detekt || true
        continue-on-error: true

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: localfile

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest || true
        continue-on-error: true

      - name: Dependency check
        run: ./gradlew dependencyCheckAnalyze || true
        continue-on-error: true

      # 构建 release APK（= 实际分发产物，约 17MB）。
      # 不用 assembleDebug：debug 不开 R8，产物约 78MB，会误触体积红线。
      # release 使用 debug 签名（见 app/build.gradle.kts），无需额外密钥即可构建安装。
      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Redline scan - check no real keys
        shell: bash
        run: |
          echo "=== 红线扫描：检查 APK 是否含真实 key ==="
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK_FILE" ]; then
            # 注意：APK 内本来就有掩码文案 "sk-..."，所以不能用 grep "sk-" 直接判断，
            # 这里只匹配 sk-<20 位以上字母数字> 且排除 sk-xxxx 占位符。
            FOUND=$(strings "$APK_FILE" 2>/dev/null | grep -Eho "sk-[A-Za-z0-9]{20,}" | sort -u | grep -vE '^sk-x+$' || true)
            if [ -n "$FOUND" ]; then
              echo "⚠️ 发现疑似 key："
              echo "$FOUND"
              exit 1
            fi
            strings "$APK_FILE" 2>/dev/null | grep -q "deepseek-chat" && (echo "⚠️ 发现真实模型名" && exit 1) || true
          fi
          echo "✅ 红线扫描通过"

      - name: Size check
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK_FILE" ]; then
            SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null)
            SIZE_MB=$((SIZE / 1048576))
            echo "APK size: ${SIZE_MB}MB"
            if [ $SIZE_MB -gt 60 ]; then
              echo "⚠️ 超过 60MB 限制！"
              exit 1
            fi
            echo "✅ 体积检查通过"
          else
            echo "⚠️ 未找到 release APK"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: localfile-apk
          path: localfile/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          cd localfile
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          cd localfile
          ./gradlew signReleaseBundle || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: localfile/app/build/outputs/apk/release/*.apk
          generate_release_notes: true

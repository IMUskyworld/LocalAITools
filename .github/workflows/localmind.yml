# LocalMind CI/CD 流水线
# 对齐：部署设计 §4.2 流水线 8 阶段

name: LocalMind CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'localmind/**'
      - 'shared-contract/**'
      - '.github/workflows/localmind.yml'
  pull_request:
    branches: [main]
    paths:
      - 'localmind/**'
      - 'shared-contract/**'
      - '.github/workflows/localmind.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: localmind

    steps:
      - uses: actions/checkout@v4

      # 用 npm 而不是 pnpm：package-lock.json 与 package.json 保持同步（npm ci 校验通过），
      # 而 pnpm-lock.yaml 曾长期落后于 package.json，且 workflow 里钉的 pnpm 8
      # 读不了 lockfileVersion 9 的锁文件。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: localmind/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint || true
        continue-on-error: true

      - name: TypeScript type check
        run: npx tsc --noEmit || true
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        continue-on-error: true

      - name: Rust fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        continue-on-error: true

  test:
    name: Build & Test
    runs-on: windows-latest
    needs: lint
    defaults:
      run:
        working-directory: localmind

    steps:
      - uses: actions/checkout@v4

      # 用 npm 而不是 pnpm：package-lock.json 与 package.json 保持同步（npm ci 校验通过），
      # 而 pnpm-lock.yaml 曾长期落后于 package.json，且 workflow 里钉的 pnpm 8
      # 读不了 lockfileVersion 9 的锁文件。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: localmind/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test || true
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml || true
        continue-on-error: true

      - name: Security audit
        run: |
          cargo audit --manifest-path src-tauri/Cargo.toml || true
          npm audit --audit-level=high || true
        continue-on-error: true

      # 这里只做前端生产构建（TypeScript + Vite）。
      # 完整安装包不在 runner 上打：tauri.conf.json 的 resources 需要
      # scripts/make_doc.exe 与 scripts/localmind-agent（由本机 PyInstaller 打包），
      # 且 llama.cpp 需要 CMake + libclang，全量构建 20-30 分钟且产物不完整。
      # 正式安装包由本机 build-localmind.ps1 + build-installer.ps1 生成。
      - name: Build frontend
        run: npm run build

      - name: Redline scan - check no real keys in frontend bundle
        shell: bash
        run: |
          echo "=== 红线扫描：前端产物不得包含真实 API key ==="
          # 设置页占位符 sk-xxxx... 属于正常文案，需排除；
          # 其余 sk-<20 位以上字母数字> 一律视为疑似真实 key。
          MATCHES=$(grep -rEho "sk-[A-Za-z0-9]{20,}" dist | sort -u | grep -vE '^sk-x+$' || true)
          if [ -n "$MATCHES" ]; then
            echo "⚠️ 发现疑似 key："
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ 红线扫描通过（无真实 key）"

      - name: Size check - frontend bundle
        shell: bash
        run: |
          echo "=== 前端产物体积检查 ==="
          SIZE_KB=$(du -sk dist | cut -f1)
          SIZE_MB=$((SIZE_KB / 1024))
          echo "  dist: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 20 ]; then
            echo "⚠️ 前端产物超过 20MB 限制！"
            exit 1
          fi
          echo "✅ 体积检查通过"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localmind-frontend
          path: localmind/dist
          retention-days: 30
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 说明：Windows 安装包由本机 build-localmind.ps1 + build-installer.ps1 生成
      # （需要 Python 打包 agent、make_doc 与 llama.cpp 工具链），CI 只产出前端产物。
      # 打 tag 时把本机生成的 LocalMindSetup.exe / LocalFile.apk 作为附件上传即可。
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: localmind-frontend
          path: ./release/frontend

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/frontend/**
          generate_release_notes: true

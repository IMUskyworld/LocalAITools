# LocalMind CI/CD 流水线
# 对齐：部署设计 §4.2 流水线 8 阶段

name: LocalMind CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'localmind/**'
      - 'shared-contract/**'
  pull_request:
    branches: [main]
    paths:
      - 'localmind/**'
      - 'shared-contract/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: localmind

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: localmind/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install frontend dependencies
        run: pnpm install

      - name: ESLint
        run: pnpm lint || true
        continue-on-error: true

      - name: TypeScript type check
        run: npx tsc --noEmit || true
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        continue-on-error: true

      - name: Rust fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        continue-on-error: true

  test:
    name: Build & Test
    runs-on: windows-latest
    needs: lint
    defaults:
      run:
        working-directory: localmind

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: localmind/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Vitest
        run: pnpm test || true
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml || true
        continue-on-error: true

      - name: Security audit
        run: |
          cargo audit --manifest-path src-tauri/Cargo.toml || true
          pnpm audit --audit-level=high || true
        continue-on-error: true

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Redline scan - check no real keys in binary
        shell: bash
        run: |
          echo "=== 红线扫描：检查安装包是否含真实 key ==="
          ! find src-tauri/target/release/bundle -type f -name "*.exe" -o -name "*.msi" | while read f; do
            strings "$f" | grep -q "sk-" && echo "⚠️ 发现疑似 key: $f" && exit 1 || true
            strings "$f" | grep -q "deepseek-chat" && echo "⚠️ 发现真实模型名: $f" && exit 1 || true
          done
          echo "✅ 红线扫描通过"

      - name: Size check
        shell: bash
        run: |
          echo "=== 安装包体积检查 ==="
          find src-tauri/target/release/bundle -name "*.exe" -o -name "*.msi" | while read f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            size_mb=$((size / 1048576))
            echo "  $f: ${size_mb}MB"
            [ $size_mb -gt 80 ] && echo "⚠️ 超过 80MB 限制！" && exit 1 || true
          done
          echo "✅ 体积检查通过"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localmind-installer
          path: localmind/src-tauri/target/release/bundle/
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: localmind-installer
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./release/**/*.exe
            ./release/**/*.msi
          body_path: CHANGELOG.md || echo "Release ${{ github.ref_name }}"
          generate_release_notes: true

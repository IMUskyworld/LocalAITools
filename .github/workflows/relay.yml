name: Relay CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'relay-server/**'
      - 'shared-contract/**'
      - '.github/workflows/relay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'relay-server/**'
      - 'shared-contract/**'
      - '.github/workflows/relay.yml'

concurrency:
  group: relay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust format
        run: cargo fmt --manifest-path relay-server/Cargo.toml --all --check

      - name: Rust clippy
        run: cargo clippy --manifest-path relay-server/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path relay-server/Cargo.toml

      - name: Release build
        run: cargo build --manifest-path relay-server/Cargo.toml --release

      - name: Docker image build
        run: docker build -f relay-server/Dockerfile -t localmind-relay:${{ github.sha }} .
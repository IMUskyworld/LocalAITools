[package]
name = "localmind-shared-contract"
version = "0.1.0"
edition = "2021"
description = "LocalMind/LocalFile shared protocol contracts"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }